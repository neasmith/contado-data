name: Build map data

on:
  workflow_dispatch:            # кнопка «Run workflow» во вкладке Actions
    inputs:
      countries:
        description: "Country codes to build (IT FR), ALL, or NEW (countries not built yet) plus codes. Empty — new countries and a sixth of the rest"
        required: false
        default: ""
      probe:
        description: "Instead of building, only show boundary levels of these Geofabrik extracts, e.g. europe/greece"
        required: false
        default: ""
  schedule:
    - cron: "17 3 3 * *"        # раз в месяц, 3-го числа в 03:17 UTC: новые страны и шестая часть остальных

permissions:
  contents: write               # чтобы выкладывать готовые файлы в Releases

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      codes: ${{ steps.plan.outputs.codes }}
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the release exists
        if: ${{ !inputs.probe }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps > /dev/null 2>&1 || \
            gh release create maps --title "Maps" \
              --notes "Country boundaries for Contado. Data © OpenStreetMap contributors, ODbL."
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRIES: ${{ inputs.countries }}
          PROBE: ${{ inputs.probe }}
        run: |
          export ASSETS="$(gh release view maps --json assets -q '.assets[].name' 2>/dev/null || true)"
          # Список выгрузок Geofabrik. Не пустил — берём копию с прошлого раза из выпуска.
          if [ -z "$PROBE" ]; then
            if curl -L --fail --retry 6 --retry-delay 20 --retry-all-errors \
                 -o geofabrik-index.json https://download.geofabrik.de/index-v1-nogeom.json; then
              gh release upload maps geofabrik-index.json --clobber || true
            else
              gh release download maps --pattern geofabrik-index.json --clobber
            fi
          fi
          python3 plan.py >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    # Geofabrik отдаёт около 1 МБ/с: Россия (4 ГБ) качается час с лишним, США (11 ГБ) — около трёх.
    timeout-minutes: 350
    strategy:
      fail-fast: false          # одна страна не собралась — остальные всё равно
      max-parallel: 4           # не больше четырёх загрузок с Geofabrik сразу
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install "osmium>=4.0,<5" "shapely>=2.0" numpy pycountry

      # США, Россия, Канада — по 5–11 ГБ: убираем с диска сборщика то, что нам не нужно.
      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      # Страна может лежать в нескольких выгрузках (source через пробел) — тогда склеиваем.
      # Адрес у Geofabrik с 20.11.2026 — в папке выгрузки (europe/estonia/estonia-latest.osm.pbf);
      # старый (europe/estonia-latest.osm.pbf) — запасной. Geofabrik иногда по нескольку минут не пускает
      # часть адресов GitHub — тогда та же выгрузка с зеркала OpenStreetMap France (там Океания — «oceania»).
      - name: Download from Geofabrik and keep only boundaries
        run: |
          n=0
          for source in ${{ matrix.source }}; do
            n=$((n+1))
            name=$(basename "$source")
            mirror="https://download.openstreetmap.fr/extracts/$(echo "$source" | sed 's/^australia-oceania/oceania/')-latest.osm.pbf"
            curl -L --fail --retry 8 --retry-delay 45 --retry-all-errors -o source.osm.pbf \
                "https://download.geofabrik.de/$source/$name-latest.osm.pbf" \
              || curl -L --fail --retry 2 --retry-delay 30 -o source.osm.pbf \
                "https://download.geofabrik.de/$source-latest.osm.pbf" \
              || curl -L --fail --retry 5 --retry-delay 30 -o source.osm.pbf "$mirror"
            osmium tags-filter source.osm.pbf r/boundary=administrative -o part$n.osm.pbf
            rm source.osm.pbf
          done
          if [ $n -gt 1 ]; then osmium merge part*.osm.pbf -o boundaries.osm.pbf; else mv part1.osm.pbf boundaries.osm.pbf; fi

      - name: Show boundary levels
        if: ${{ matrix.codes == '' }}
        run: python3 build_country.py --probe boundaries.osm.pbf

      - name: Build files for the app
        if: ${{ matrix.codes != '' }}
        run: python3 build_country.py boundaries.osm.pbf out ${{ matrix.codes }}

      - name: Publish to Releases
        # И если одна из стран выгрузки не собралась — остальные выкладываем.
        if: ${{ always() && matrix.codes != '' && hashFiles('out/*') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload maps out/* --clobber

  catalog:
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && !inputs.probe }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "shapely>=2.0"

      - name: Download built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download maps --dir files --pattern "*-index.json" --pattern "*-comuni.vpkg"

      - name: Build the list of countries
        run: python3 build_catalog.py files catalog.json

      - name: Publish the list
        env:
          GH_TOKEN: ${{ github.token }}
          CODES: ${{ needs.plan.outputs.codes }}
        run: |
          gh release upload maps catalog.json --clobber
          # Убираем файлы стран, которых больше нет ни у Geofabrik, ни в countries.json.
          # Только если список стран полный: 20.11.2026 сломанный список Geofabrik дал 24 страны,
          # и этот шаг удалил файлы остальных 174.
          codes=" $(echo "$CODES" | tr 'A-Z' 'a-z') "
          if [ "$(echo $CODES | wc -w)" -lt 150 ]; then
            echo "only $(echo $CODES | wc -w) countries in the list — not deleting anything"
          elif [ -n "$CODES" ]; then
            for name in $(gh release view maps --json assets -q '.assets[].name'); do
              # Трогаем только файлы стран: «it-index.json», «it-comuni.vpkg».
              echo "$name" | grep -qE '^[a-z]{2}-(index\.json|comuni\.vpkg)$' || continue
              code="${name%%-*}"
              echo "$codes" | grep -q " $code " || gh release delete-asset maps "$name" --yes
            done
          fi
          gh release edit maps --title "Maps $(date -u +%Y-%m-%d)"
